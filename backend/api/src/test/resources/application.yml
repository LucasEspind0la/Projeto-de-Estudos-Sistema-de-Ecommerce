spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    chave-secreta: ${JWT_SECRET:minha_chave_super_secreta_com_mais_de_32_caracteres_1234}
    expiracao-ms: 86400000
  upload:
    diretorio: ./uploads
    subdiretorio-produtos: produtos
