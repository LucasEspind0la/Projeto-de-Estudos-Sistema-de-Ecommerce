spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/loja_db
    username: ${DB_USERNAME:usuario_do_banco}
    password: ${DB_PASSWORD:sua_senha_aqui}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
app:
  jwt:
    chave-secreta: ${LOJA_JWT_SECRET:minha_chave_super_secreta_com_mais_de_32_caracteres_1234}
    expiracao-ms: 86400000
  upload:
    diretorio: ./uploads
    subdiretorio-produtos: produtos
server:
  port: 8080
